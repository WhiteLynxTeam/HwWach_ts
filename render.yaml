services:
  - type: web
    name: hwwach-api
    env: docker
    region: frankfurt  # или любой другой регион на ваш выбор
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: hwwach-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hwwach-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: hwwach-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hwwach-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: hwwach-db
          property: database
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_EXPIRATION_TIME
        value: 15m
      - key: JWT_REFRESH_EXPIRATION_TIME
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 10
      - key: PORT
        value: 3000

databases:
  - name: hwwach-db
    region: frankfurt  # или любой другой регион на ваш выбор
    plan: free